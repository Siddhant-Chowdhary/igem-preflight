<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 520" width="880" height="520" font-family="Helvetica, Arial, sans-serif">
  <rect width="880" height="520" fill="#ffffff"/>
  <text x="440" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1a1a1a">Two different questions about a strain-design pipeline</text>
  <text x="440" y="56" text-anchor="middle" font-size="13" fill="#5a5a5a">Search answers one. Pre-flight answers the other. Neither substitutes for the other.</text>

  <!-- LEFT: search axis -->
  <rect x="34" y="84" width="380" height="186" rx="8" fill="#f4f6f8" stroke="#c9d2da" stroke-width="1.4"/>
  <text x="54" y="110" font-size="14" font-weight="700" fill="#2c3e50">1. Which candidate scores best?</text>
  <text x="54" y="132" font-size="12" fill="#5a5a5a">Answered by SEARCH. Established methods.</text>
  <rect x="54" y="146" width="150" height="34" rx="5" fill="#ffffff" stroke="#8fa3b5" stroke-width="1.2"/>
  <text x="129" y="168" text-anchor="middle" font-size="12.5" fill="#2c3e50">brute force (exact)</text>
  <rect x="216" y="146" width="88" height="34" rx="5" fill="#ffffff" stroke="#8fa3b5" stroke-width="1.2"/>
  <text x="260" y="168" text-anchor="middle" font-size="12.5" fill="#2c3e50">greedy</text>
  <rect x="316" y="146" width="78" height="34" rx="5" fill="#ffffff" stroke="#8fa3b5" stroke-width="1.2"/>
  <text x="355" y="168" text-anchor="middle" font-size="12.5" fill="#2c3e50">RL</text>
  <text x="54" y="206" font-size="12" fill="#3d3d3d">Returns a ranked list and a winner.</text>
  <text x="54" y="226" font-size="12" font-weight="600" fill="#9c2b2b">Cannot tell you whether the ranking is real.</text>
  <text x="54" y="248" font-size="11.5" fill="#6a6a6a">Brute force is exact, so its output looks the</text>
  <text x="54" y="263" font-size="11.5" fill="#6a6a6a">most authoritative of all — even when it is noise.</text>

  <!-- RIGHT: validity axis -->
  <rect x="466" y="84" width="380" height="186" rx="8" fill="#eef4ef" stroke="#a9c5b0" stroke-width="1.4"/>
  <text x="486" y="110" font-size="14" font-weight="700" fill="#245c36">2. Does &#8220;best&#8221; mean anything?</text>
  <text x="486" y="132" font-size="12" fill="#5a5a5a">Answered by PRE-FLIGHT. This is what we built.</text>
  <text x="486" y="156" font-size="12" fill="#3d3d3d">Six checks on the scoring function itself:</text>
  <text x="496" y="177" font-size="11.5" fill="#245c36">&#8226; does doing nothing score as well?</text>
  <text x="496" y="194" font-size="11.5" fill="#245c36">&#8226; can the score separate candidates at all?</text>
  <text x="496" y="211" font-size="11.5" fill="#6a6a6a">&#8226; does a weighted sum control the blend?</text>
  <text x="496" y="228" font-size="11.5" fill="#6a6a6a">&#8226; are product exchanges realistically bounded?</text>
  <text x="496" y="245" font-size="11.5" fill="#6a6a6a">&#8226; is growth confounding the score?</text>
  <text x="496" y="262" font-size="11.5" fill="#6a6a6a">&#8226; do the scoring parameters do anything?</text>

  <!-- flow -->
  <text x="34" y="312" font-size="13" font-weight="700" fill="#1a1a1a">How they fit together</text>
  <rect x="34" y="326" width="128" height="46" rx="6" fill="#ffffff" stroke="#8fa3b5" stroke-width="1.3"/>
  <text x="98" y="346" text-anchor="middle" font-size="12" fill="#2c3e50">model +</text>
  <text x="98" y="362" text-anchor="middle" font-size="12" fill="#2c3e50">scoring function</text>
  <path d="M162 349 L204 349" stroke="#6a6a6a" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="206" y="326" width="120" height="46" rx="6" fill="#eef4ef" stroke="#2f7d46" stroke-width="1.8"/>
  <text x="266" y="346" text-anchor="middle" font-size="12" font-weight="700" fill="#245c36">PRE-FLIGHT</text>
  <text x="266" y="362" text-anchor="middle" font-size="11" fill="#245c36">six checks</text>
  <path d="M326 340 L372 318" stroke="#6a6a6a" stroke-width="1.6" marker-end="url(#a)"/>
  <path d="M326 358 L372 400" stroke="#6a6a6a" stroke-width="1.6" marker-end="url(#a)"/>
  <text x="340" y="312" font-size="10.5" font-weight="600" fill="#2f7d46">pass</text>
  <text x="332" y="398" font-size="10.5" font-weight="600" fill="#9c2b2b">fail</text>

  <rect x="376" y="286" width="150" height="44" rx="6" fill="#ffffff" stroke="#8fa3b5" stroke-width="1.3"/>
  <text x="451" y="305" text-anchor="middle" font-size="12" fill="#2c3e50">run the search</text>
  <text x="451" y="321" text-anchor="middle" font-size="11" fill="#6a6a6a">(brute force at our scale)</text>
  <path d="M526 308 L570 308" stroke="#6a6a6a" stroke-width="1.6" marker-end="url(#a)"/>
  <rect x="572" y="284" width="190" height="48" rx="6" fill="#f4f6f8" stroke="#8fa3b5" stroke-width="1.3"/>
  <text x="667" y="303" text-anchor="middle" font-size="12" fill="#2c3e50">proposal sheet, with</text>
  <text x="667" y="320" text-anchor="middle" font-size="11" fill="#6a6a6a">confidence tiers + falsification</text>

  <rect x="376" y="382" width="386" height="48" rx="6" fill="#fdf0ee" stroke="#c0564a" stroke-width="1.6"/>
  <text x="569" y="401" text-anchor="middle" font-size="12" font-weight="700" fill="#8f2a1e">NO PROPOSALS ISSUED &#8212; and the reason why</text>
  <text x="569" y="418" text-anchor="middle" font-size="11" fill="#8f2a1e">no tool we surveyed does this</text>

  <rect x="34" y="452" width="812" height="48" rx="6" fill="#f7f7f5" stroke="#d6d6d2" stroke-width="1.2"/>
  <text x="48" y="472" font-size="11.5" fill="#3d3d3d"><tspan font-weight="700">The threshold that matters is the assay&#8217;s, not the solver&#8217;s.</tspan> GC-MS composition carries 1&#8211;5% replicate error, so a model</text>
  <text x="48" y="489" font-size="11.5" fill="#3d3d3d">ranking two designs 0.01% apart is making a claim no experiment can test. Our first version used solver tolerance and passed a broken setup.</text>

  <defs><marker id="a" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0 L8 4 L0 8 z" fill="#6a6a6a"/></marker></defs>
</svg>
